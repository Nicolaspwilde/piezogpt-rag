<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .card { fill:#071133; stroke:#93c5fd; stroke-width:1.5; rx:10; ry:10 }
    .h { fill:#fff; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:600 }
    .t { fill:#cbd5e1; font-family:Inter, Arial, sans-serif; font-size:12px }
    .arrow { stroke:#93c5fd; stroke-width:2.5; marker-end:url(#a) }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#93c5fd" />
    </marker>
  </defs>

  <text x="20" y="28" class="h">Repository architecture & data flow</text>

  <!-- repo layout -->
  <rect x="20" y="50" width="250" height="150" class="card" />
  <text x="145" y="78" text-anchor="middle" class="h">Repository</text>
  <text x="40" y="100" class="t">/data/ — source PDFs</text>
  <text x="40" y="120" class="t">/Databank/ — outputs (text, chunks)</text>
  <text x="40" y="140" class="t">/src/ — scripts (extract, chunk, embed, etc.)</text>

  <!-- runtime components -->
  <rect x="320" y="50" width="240" height="120" class="card" />
  <text x="440" y="78" text-anchor="middle" class="h">Runtime</text>
  <text x="340" y="100" class="t">Python scripts (CLI)</text>
  <text x="340" y="120" class="t">No server — run locally or wrap in a service</text>

  <!-- external services -->
  <rect x="320" y="200" width="240" height="120" class="card" />
  <text x="440" y="228" text-anchor="middle" class="h">External</text>
  <text x="340" y="250" class="t">Gemini / google-genai — embeddings & generation</text>
  <text x="340" y="270" class="t">(requires GEMINI_API_KEY in .env)</text>

  <!-- vector store -->
  <rect x="640" y="120" width="220" height="120" class="card" />
  <text x="750" y="148" text-anchor="middle" class="h">Vector Store</text>
  <text x="660" y="170" class="t">FAISS / Chroma (local persistence)</text>

  <!-- arrows showing flow -->
  <line x1="270" y1="95" x2="320" y2="95" class="arrow" />
  <line x1="560" y1="110" x2="640" y2="160" class="arrow" />
  <line x1="460" y1="260" x2="640" y2="180" class="arrow" />

  <!-- captions -->
  <text x="20" y="330" class="t">How it runs: Place PDFs in /data → run src/read_data.py to extract text → src/chunk_text.py to create chunks → src/create_embeddings.py to call Gemini → store vectors locally and query with retriever/chatbot.</text>

</svg>
